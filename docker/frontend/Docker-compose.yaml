services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image : prashantbist/frontend:latest
    volumes:
      - /app/node_modules
      - .:/app
    ports:
      - "3000:3000"
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image : prashantbist/frontend-test:latest
    volumes:
      - /app/node_modules
      - .:/app
    command: ["npm","run", "test"]
